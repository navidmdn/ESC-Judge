# ─── Provider (the model under test) ───────────────────────────
provider_role: "data/prompts/supporter_social_companion.txt"
opening_line: "Hey! I am Pepper, your social Companion. What's your name?"

# ─── Seeker (simulated help-seeker, cloud) ─────────────────────
# Any OpenAI-compatible provider works. Set base_url and api_key_env
# for your provider. The actual key goes in .env, never here.
seeker:
  model: "gpt-4o-mini"
  base_url: "https://api.openai.com/v1"  # change for other providers
  api_key_env: "OPENAI_API_KEY" # name of the env var in .env holding the key
  temperature: 0.8
  max_tokens: 512
  template_file: "data/prompts/seeker_template.txt"
  pricing:                        # cost per 1M tokens, in USD
    input: 0.15                   # gpt-4o-mini input
    output: 0.60                  # gpt-4o-mini output

# ─── Scenarios ─────────────────────────────────────────────────
scenarios_file: "data/roles-v1.json"
n_scenarios: 3            # use first N personas from scenarios_file (null = all)

# ─── Generation settings ──────────────────────────────────────
n_turns: 10
n_repetitions: 1
output_dir: "transcripts"

# ─── Pipeline latency estimates (seconds) ─────────────────────
# Researchers set these based on their robot's speech pipeline.
# Used to compute estimated end-to-end latency per supporter turn.
pipeline_estimates:
  stt_s: 0.85
  tts_s: .3

# ─── Candidate configurations ─────────────────────────────────
# Each entry is one model config to evaluate.
# The harness runs them sequentially: start server → run all
# scenarios × reps → stop server → next config.
candidates:

  - config_id: "Llama-3.2-3B-Instruct-Q3_K_M.gguf"
    model_path: "models/Llama-3.2-3B-Instruct-Q3_K_M.gguf"
    server_binary: "~/research/llama.cpp/build-metal/bin/llama-server"
    n_gpu_layers: 99
    n_ctx: 8192
    temperature: 0.7
    max_tokens: 512
    extra_args: ["-fa", "1"]
    port: 8080

